[project]
name = "planner-service"
version = "0.1.0"
description = "AgroPilot planner service: a daily drip-irrigation plan per plot (FAO-56)."
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.162",
    "httpx~=0.28",
    "pydantic-settings~=2.16",
    "uvicorn~=0.54",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx2~=2.16",
    "pytest~=9.2",
]
