[project]
name = "weather-service"
version = "0.1.0"
description = "AgroPilot weather service: daily ET0 and rain from Open-Meteo."
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.162",
    "httpx~=0.28",
    "pydantic-settings~=2.16",
    "uvicorn~=0.54",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx2~=2.16",
    "pytest~=9.2",
    "pytest-cov>=7.0",
]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 100
