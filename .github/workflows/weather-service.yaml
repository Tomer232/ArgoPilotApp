name: weather-service

on:
  pull_request:
    branches: [main]

jobs:
  weather-test:
    name: weather-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/weather-service

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term --cov-report=html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weather-service-coverage
          path: services/weather-service/htmlcov/

  weather-audit:
    name: weather-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/weather-service

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Audit dependencies
        run: uv audit --locked --preview-features audit-command
