name: planner-service

on:
  pull_request:
    branches: [main]

jobs:
  planner-test:
    name: planner-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/planner-service

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest
